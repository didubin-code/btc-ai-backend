services:
  - type: web
    name: btc-ai-backend-v74-brtitruth
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: OPENAI_TIMEOUT_MS
        value: "7500"

      - key: CF_BRTI_URL
        value: "https://www.cfbenchmarks.com/data/indices/BRTI"
      - key: CF_TIMEOUT_MS
        value: "3500"
      - key: CF_MAX_AGE_MS
        value: "9000"
