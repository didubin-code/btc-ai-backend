services:
  - type: web
    name: btc-ai-backend-v73-3-streamguard
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: OPENAI_TIMEOUT_MS
        value: "7500"
